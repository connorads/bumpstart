[tools]
bats = "1"
shellcheck = "0.11"
# PowerShell 7 (registry name `powershell` → aqua:PowerShell/PowerShell) puts
# pwsh on PATH under the repo's supply-chain posture. The pwsh tests + lint run
# under pwsh 7 + Pester 5; the Windows 5.1 floor is enforced by the compat rules
# in lint-ps, not the test runtime (Pester 5 on 5.1 is painful).
"aqua:PowerShell/PowerShell" = "7"

# Declared here rather than inherited from a maintainer's global config: this is a
# public repo, so `mise.lock` has to be maintained by whoever clones it. The
# platform list is every host the tools are resolved on — the three CI lanes
# (macos-latest is arm64, ubuntu-latest and windows-latest are x64) plus the two
# contributor architectures CI doesn't cover.
[settings]
lockfile = true
lockfile_platforms = [
  "macos-arm64",
  "macos-x64",
  "linux-x64",
  "linux-arm64",
  "windows-x64",
]

[tasks.lint]
description = "Shellcheck all scripts"
# The path list is explicit, so a new directory of scripts cannot join the repo and
# silently escape the gate — which is exactly what tests/real/ would have done.
run = """
shellcheck -x lib/*.sh blocks/*/apply.sh install.sh vibe tests/helpers/*.sh \
  tests/real/*.sh tests/real/lib/*.sh tests/real/lanes/*.sh tests/real/guests/*.sh \
  tests/real/bin/askpass tests/real/bin/sudo-forces-askpass
"""

[tasks.test]
description = "Run the bats suite (product code runs under /bin/bash via the isolated PATH)"
run = "bats tests/"

[tasks.test-fast]
description = "Run the bats suite, skipping integration-tagged tests"
run = "bats --filter-tags '!integration' tests/"

[tasks.test-bash32]
description = "Run the whole suite under macOS /bin/bash (3.2) — the support contract"
run = "/bin/bash \"$(command -v bats)\" tests/"

[tasks.check]
description = "Lint + full suite (bash spine)"
depends = ["lint", "test"]

# ── Real installs, on pristine machines ───────────────────────────────────────
# The faked suite above is the commit-time gate and stays fast. These lanes really
# install from vendor URLs into machines that have never seen vibe, so they are slow
# (30-60 minutes for everything), hit third parties, and are invoked explicitly.
# Prerequisites and the lane table are in the README's Development section.
#
# Three exit classes, not pass/fail: 1 = an assertion failed (vibe is wrong),
# 2 = infrastructure (a guest, an image, a vendor URL), 3 = a harness bug.
# Rationale and rejected alternatives: docs/adr/0003.

[tasks.vm-test]
description = "Every real-install lane, locally (30-60 min; needs colima + tart)"
# depends on the image, like vm-test-macos: `all` includes the tart lanes, so on a
# fresh machine this reported class 2 thirty minutes in for want of a 23 GB pull.
depends = ["vm-image-macos"]
run = "bash tests/real/drive.sh --group all"

[tasks.vm-test-linux]
description = "The container lanes only (~10 min; needs a running colima)"
run = "bash tests/real/drive.sh --group linux"

[tasks.vm-test-macos]
description = "The pristine-Mac lanes (needs tart + the 23 GB image)"
depends = ["vm-image-macos"]
run = "bash tests/real/drive.sh --group macos"

[tasks.vm-image-macos]
description = "Pull the vanilla macOS image once (23 GB)"
# sources/outputs so the guard is not re-checked on every macOS run. The stamp is the
# output; lanes.tsv is the source, because that is where the image name lives.
sources = ["tests/real/lanes.tsv"]
outputs = [".bumpstart-real/macos-image.stamp"]
run = """
set -eu
image="$(awk -F'\t' 'NR > 1 && $2 == "tart" { print $3; exit }' tests/real/lanes.tsv)"
if ! command -v tart >/dev/null 2>&1; then
  echo "tart is not installed - see the README Development section" >&2
  exit 1
fi
# --source local, and an exact name. A bare `tart list` shows the pulled OCI IMAGE
# as well as the local clone, so an interrupted clone left this task saying
# "already pulled" while every macOS lane failed class 2 with a remedy pointing
# back here.
if tart list --source local --quiet 2>/dev/null | grep -qx -- "$image"; then
  echo "$image already cloned"
else
  echo "pulling $image (~23 GB, once)"
  TART_NO_AUTO_PRUNE=1 tart pull "ghcr.io/cirruslabs/$image:latest"
  TART_NO_AUTO_PRUNE=1 tart clone "ghcr.io/cirruslabs/$image:latest" "$image"
fi
mkdir -p .bumpstart-real
date > .bumpstart-real/macos-image.stamp
"""

[tasks.vm-clean]
description = "Reap leftover real-install guests, their log bundles and their scratch"
run = """
set -u
docker ps -aq --filter 'name=^bumpstart-real-' 2>/dev/null | xargs -r docker rm -f
if command -v tart >/dev/null 2>&1; then
  # --source local --quiet, not a grep over JSON: the old pattern failed OPEN, so a
  # shape change upstream would leave 6 GB guests behind and say "clean".
  tart list --source local --quiet 2>/dev/null | grep '^bumpstart-real-' | while read -r vm; do
    tart stop "$vm" >/dev/null 2>&1 || true
    tart delete "$vm" >/dev/null 2>&1 || true
  done
fi
# The runner adapter's read-only repo copy, and the tart console logs. Neither is
# under .bumpstart-real, so neither was ever reaped - and the copy is chmod a-w, which is
# why the write bit goes back first.
src="${TMPDIR:-/tmp}/bumpstart-real-src"
[ -d "$src" ] && chmod -R u+w "$src" 2>/dev/null
rm -rf "$src" "${TMPDIR:-/tmp}"/bumpstart-tart-bumpstart-real-*.log
rm -rf .bumpstart-real
echo "clean"
"""

# ── PowerShell spine (twin-authored core, Windows support) ────────────────────
# Tests run under mise's pwsh 7 + Pester 5; the Windows PowerShell 5.1 floor is
# enforced by the compat rules in lint-ps, not the test runtime. Run
# `pwsh -File bootstrap.ps1` once first to install the pinned Pester +
# PSScriptAnalyzer. `check` stays bash-only so a Mac without pwsh keeps working.

[tasks.test-ps]
description = "Run the Pester suite (pure core + shared contract); a skipped test fails it"
# Via a script, not Invoke-Pester directly, because the suite has nothing legitimate
# to skip and a skip is how a host difference gets papered over — see the header.
run = "pwsh -File scripts/check-ps-suite.ps1"

[tasks.lint-ps]
description = "PSScriptAnalyzer (5.1-floor compat gate) + the OS-automatic-var grep"
run = [
  "pwsh -Command \"Invoke-ScriptAnalyzer -Path lib -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit\"",
  # The block tails run on the same Windows as the spine, so they are held to the
  # same floor — the mirror of `lint` including blocks/*/apply.sh, and for the same
  # reason: a directory of scripts must not be able to join the repo and silently
  # escape the gate.
  "pwsh -Command \"Invoke-ScriptAnalyzer -Path blocks -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit\"",
  "pwsh -Command \"Invoke-ScriptAnalyzer -Path vibe.ps1 -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit\"",
  "pwsh -Command \"Invoke-ScriptAnalyzer -Path install.ps1 -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit\"",
  "pwsh -Command \"Invoke-ScriptAnalyzer -Path bootstrap.ps1 -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit\"",
  # The real-install probe runs under powershell.exe 5.1 in the guest, so it is held
  # to the same floor as the spine — it would otherwise escape every gate.
  "pwsh -Command \"Invoke-ScriptAnalyzer -Path tests/real -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit\"",
  "pwsh -File scripts/lint-automatic-os-vars.ps1",
]

[tasks.check-ps]
description = "PowerShell lint + Pester suite"
depends = ["lint-ps", "test-ps"]
