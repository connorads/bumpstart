name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the real-install job only: it depends on third-party vendor URLs,
    # so it is the leg that catches an upstream installer changing under us.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    # macOS runner so the bash suite runs against the real /bin/bash 3.2 - the
    # support contract this project targets. Also runs the pwsh pure core (it is
    # cross-platform), so it is validated on both OSes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }} # releases API rate limit for aqua pwsh
      - run: mise run lint
      - run: mise run test-bash32
      - run: pwsh -File bootstrap.ps1
      - run: mise run test-ps

  check-windows:
    # windows-latest so the PowerShell spine is validated on real Windows: the
    # PSScriptAnalyzer 5.1-floor gate (lint-ps), the Pester suite with faked
    # install dispatch (test-ps), and a dynamic 5.1 smoke under powershell.exe.
    #
    # test-ps here is the SAME suite the `check` job runs on macOS, on a host that has a
    # per-user registry and a desktop. So the suite states no fact about its host - both
    # worlds go behind the seam and its fake (tests/helpers/FakeEnvKey.ps1) - and this
    # job proves that by running the identical file where the environment is real.
    # aqua pwsh under mise-action on windows is plausible but unverified end to
    # end; if it can't resolve, swap test-ps to the runner's built-in pwsh 7.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pwsh -File bootstrap.ps1
      - run: mise run lint-ps
      - run: mise run test-ps
      # Layer-4 backstop: the beginner paste runs in Windows PowerShell 5.1, not
      # pwsh 7. Render the plan under real 5.1 to catch runtime breakage the static
      # compat rules can't see. --plan stops before any effect.
      - name: 5.1 floor smoke (powershell.exe)
        shell: powershell
        run: powershell.exe -File lib/apply.ps1 -Plan -Yes claude starter

  check-linux:
    # The Linux lane, across the distro families the support claim covers. `docker
    # run` inside a step, deliberately NOT a container job: a container job mounts
    # the runner's externals over the image, and its musl detection is hardcoded to
    # Alpine (actions/runner#3852) - which is not a target here.
    #
    # bats is fetched once on the host and mounted in, so no leg depends on its
    # image packaging bats: only Ubuntu and Alpine were verified to, and Alpine is
    # out of scope. The macos-latest lane still asserts the real bash 3.2 floor, so
    # these legs running bash 5 are a genuinely different run, not a duplicate.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            deps: apt-get update -qq && apt-get install -y -qq gnupg git
          - image: debian:12
            deps: apt-get update -qq && apt-get install -y -qq gnupg git
          - image: fedora:42
            deps: dnf install -y -q gnupg2 git
          - image: archlinux:base
            deps: pacman -Sy --noconfirm --needed gnupg git
    steps:
      - uses: actions/checkout@v5
      - name: Fetch bats
        run: |
          mkdir -p "$RUNNER_TEMP/bats"
          curl -fsSL https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bats" --strip-components=1
      # The repo is mounted read-only: the suite writes only to an isolated HOME and
      # to TMPDIR, and this proves it.
      #
      # As an UNPRIVILEGED user, not root. A container starts as root, and root
      # bypasses the permission bits the runner guest adapter uses to make the repo
      # read-only - so the guest-port contract failed here for a reason that is not
      # about the code, on the one leg where its "runs as an unprivileged user"
      # property could not fail either. Nothing in tests/ needs root.
      - name: bats suite on ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/bats:/bats:ro" \
            -w /src \
            "${{ matrix.image }}" \
            /bin/bash -c '
              set -e
              # gnupg for the signing-key cases, git for the repo-init cases: both
              # assert real tool behaviour, so faking them would assert nothing - so a
              # failed install FAILS the step. It used to be swallowed whole
              # (`>/dev/null 2>&1 || echo note`), which turned "the mirror moved" into a
              # quietly reduced suite with the reason discarded.
              ${{ matrix.deps }}
              # -s /bin/bash and plain `su` (not `su -`), for the two reasons
              # guests/container.sh spells out: useradd defaults to /bin/sh, and `su`
              # resets HOME/SHELL/USER from /etc/passwd while keeping the rest of the
              # environment.
              id -u vibe >/dev/null 2>&1 || useradd -m -s /bin/bash vibe
              exec su vibe -c "cd /src && exec /bats/bin/bats tests/"
            '

  real-lanes:
    # The lane matrix is DATA (tests/real/lanes.tsv), read by `mise run vm-test`
    # locally AND by CI here, so "local and CI run the same thing" is true rather than
    # aspirational. A new lane row joins CI with no workflow change.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # It gates the whole Linux matrix, so a hang here is the whole real-install suite
    # not running - and a job with no timeout gets the six-hour default.
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: |
          # The same lane_names() the local driver uses, so "local and CI run the
          # same thing" holds for the lane LIST too, not only for each lane.
          . tests/real/lib/lanes.sh
          lanes="$(lane_names tests/real/lanes.tsv container | jq -R . | jq -sc .)"
          # awk exits 0 on no match, so a renamed adapter token yields `[]`, the
          # matrix covers nothing, and eight lanes vanish into a green tick. The
          # Windows job guards its derived list three steps down; this one has to
          # as well.
          if [ "$lanes" = "[]" ]; then
            echo "::error::no container lanes in tests/real/lanes.tsv - the matrix would cover nothing"
            exit 1
          fi
          echo "linux=$lanes" >> "$GITHUB_OUTPUT"

  linux-real-install:
    # Not on pull_request: this really installs from vendor URLs, so it is slow and
    # depends on third parties being up. Weekly + on demand instead.
    #
    # Every lane runs twice and is decided by the same probe + judge the local lanes
    # use. The assertion that matters most is a FRESH LOGIN SHELL: success in the
    # installing shell proves nothing, because fixup_path puts the install dirs on PATH
    # for the run, so the run is green whether or not anything was persisted.
    if: github.event_name != 'pull_request'
    needs: real-lanes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJson(needs.real-lanes.outputs.linux) }}
    steps:
      - uses: actions/checkout@v5
      - name: real install lane
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set +e
          # --ref, always: the `paste` entry point fetches `vibe` itself from the
          # commit under test, and only drive.sh defaulted it - so a paste lane
          # joining the matrix died class 3 here, and NO CI job anywhere ran the
          # bootstrap ADR 0003 exists to test.
          bash tests/real/lanes/run.sh "$LANE" --ref "$GITHUB_SHA"
          rc=$?
          # Three exit classes, honoured here rather than collapsed to pass/fail: a
          # class 2 (the guest, an image, or a vendor URL) is reported without going
          # red, and a class 1 never can be. This is the structural answer to "the lane
          # will get muted".
          case "$rc" in
            0) ;;
            2) echo "::warning title=$LANE::infrastructure, not a vibe failure (class 2)" ;;
            *) exit "$rc" ;;
          esac
      # ALWAYS, and small: this is what the summary job aggregates. A lane that
      # cannot report is indistinguishable from a lane that was never scheduled, and
      # the whole point of the summary is to tell those apart.
      #
      # include-hidden-files, on every upload step here: the lane writes to
      # `.vibe-real/<lane>/`, and upload-artifact treats anything under a dot
      # directory as hidden and silently skips it. Without it all ten lanes uploaded
      # ZERO files, and the two jobs added to prove the suite proved something both
      # exited 3 with nothing to read.
      #
      # error, not warn: write_verdict runs from an EXIT trap, so every exit after it
      # is installed writes lane.verdict. Its absence means the lane produced nothing,
      # which should say so here rather than two jobs later. The one path that
      # legitimately writes none is an exit BEFORE the trap - an unknown lane name or
      # bad arguments - and that has already failed the step above.
      - name: verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-verdict-${{ matrix.lane }}
          path: |
            .vibe-real/*/lane.verdict
            .vibe-real/*/run*.manifest
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # warn here, deliberately: a lane that died before writing anything is a
      # legitimate class 2, and a second red would say nothing the step above didn't.
      - name: log bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-linux-${{ matrix.lane }}
          path: .vibe-real/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  real-differentials:
    # The half of the oracle that needs no hand-written expectations, and which no CI
    # job ran: the lanes each execute on their own runner, so the cross-lane
    # comparisons could only ever happen somewhere that has all the manifests. Here.
    if: always() && github.event_name != 'pull_request'
    needs: [real-lanes, linux-real-install, macos-real-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: real-verdict-*
          path: verdicts
      - name: reconstruct the lane layout
        run: |
          # differentials.sh reads <dir>/<lane>/run1.manifest, which is what run.sh
          # writes locally. upload-artifact roots each artifact at the least common
          # ancestor of the files it matched, so the lane directory may or may not
          # survive - the ARTIFACT NAME is the thing that reliably carries it.
          for d in verdicts/real-verdict-*; do
            [ -d "$d" ] || continue
            lane="$(basename "$d")"
            lane="${lane#real-verdict-}"
            mkdir -p ".vibe-real/$lane"
            find "$d" -type f \( -name 'lane.verdict' -o -name 'run*.manifest' \) \
              -exec cp {} ".vibe-real/$lane/" \;
          done
          find .vibe-real -type f | sort
      - name: cross-lane differentials
        run: bash tests/real/differentials.sh .vibe-real

  real-summary:
    # The failure NO per-lane job can see: whether the SUITE proved anything.
    #
    # Class 2 is a green ::warning by design - the structural answer to "the lane
    # will get muted" - so a stopped docker daemon, a registry rate limit or a guest
    # that will not boot turns EVERY leg green with annotations nobody reads on a
    # weekly schedule. And a lane silently dropped from the matrix looks exactly like
    # a lane that passed. This job is the assertion that assertions ran.
    if: always() && github.event_name != 'pull_request'
    needs: [real-lanes, linux-real-install, macos-real-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: real-verdict-*
          path: verdicts
      - name: did the suite prove anything?
        env:
          LANES: ${{ needs.real-lanes.outputs.linux }}
        run: |
          # The lanes the matrix DECLARED, not the ones that happened to report -
          # comparing the reports against themselves is how a vanished lane hides.
          lanes="$(printf '%s' "$LANES" | jq -r '.[]' | tr '\n' ' ')"
          # macos-drift is not in that list - it is a runner lane, invoked by name
          # rather than through the matrix - but it uploads a verdict like every
          # other, so it is held to the same account.
          # shellcheck disable=SC2086  # the lane list is deliberately word-split
          bash tests/real/verdicts.sh verdicts $lanes macos-drift

  macos-real-install:
    # DRIFT DETECTION, NOT A PRISTINE MAC. There is no clean hosted macOS and GitHub
    # says there never will be (runner-images#222): Homebrew, Node and git are
    # preinstalled. Scrubbing a runner is best effort, so this lane catches a vendor
    # installer changing under us; the genuine first-time-Mac path is the LOCAL tart
    # lane (`mise run vm-test-macos`). Describing this one as pristine is exactly how
    # that lane quietly stops being run.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: disk before
        run: df -h /
      - name: de-brew
        run: |
          set +e
          # Homebrew's own uninstaller first, then the leftovers it declines to touch.
          NONINTERACTIVE=1 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)" -- --force
          sudo rm -rf /opt/homebrew /usr/local/Homebrew /usr/local/Caskroom
          # The Xcode CLT too, so ensure_brew has to install it. If this lane turns
          # flaky, suspect this step first: brew reinstalls the CLT via softwareupdate,
          # which is the slowest and least predictable thing here.
          sudo rm -rf /Library/Developer/CommandLineTools
          command -v brew && echo "::warning::brew survived the scrub"
          exit 0
      - name: real install lane
        env:
          CI: "true"
        run: |
          # HOMEBREW_* is preset on the runner and would steer a "fresh" install.
          for v in $(env | sed -n 's/^\(HOMEBREW_[A-Z_]*\)=.*/\1/p'); do unset "$v"; done
          set +e
          bash tests/real/lanes/run.sh macos-drift
          rc=$?
          case "$rc" in
            0) ;;
            2) echo "::warning title=macos-drift::infrastructure, not a vibe failure (class 2)" ;;
            *) exit "$rc" ;;
          esac
      - name: disk after
        if: always()
        run: df -h /
      # include-hidden-files + error: see the Linux lane's verdict step for both.
      - name: verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-verdict-macos-drift
          path: |
            .vibe-real/*/lane.verdict
            .vibe-real/*/run*.manifest
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: log bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-macos-drift
          path: .vibe-real/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  windows-real-install:
    # The only real Windows install anywhere, and the only place the PowerShell spine's
    # acquisition is tested at all. Two legs because neither covers the other:
    # windows-11-arm is the only Windows 11 CLIENT image any CI vendor hosts (public
    # preview - pin nothing to it that windows-2025 cannot cover), and windows-2025 is
    # Server on x64.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # winget currently HANGS rather than failing, so the timeout is the guard. Two
    # runs now, so it is twice what one needs plus room for the second's no-ops.
    timeout-minutes: 35
    defaults:
      run:
        # Windows PowerShell 5.1, NOT the runner's default pwsh 7 - which would
        # silently defeat the 5.1 floor these tests exist to protect.
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: is winget in the box?
        # Asserted BEFORE bootstrapping, so the day the ARM image ships winget
        # (actions/runner-images#14083 is still open) we find out instead of quietly
        # continuing to install it ourselves.
        run: |
          $wg = Get-Command winget -ErrorAction SilentlyContinue
          if ($wg) {
            winget --version
            Write-Host "winget is in the box on $env:RUNNER_OS/$env:PROCESSOR_ARCHITECTURE"
          } else {
            Write-Host "::warning::winget is absent on this image - bootstrapping it"
          }

      - name: bootstrap winget when absent
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser -AllowClobber
            Repair-WinGetPackageManager -Force -Latest
            # $LOCALAPPDATA\Microsoft\WinGet\Links goes on PATH ONLY so the HARNESS
            # can invoke winget. The fresh-shell check reads the registry, never
            # $env:PATH, so this cannot make that assertion vacuous.
            Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links')
          }

      - name: resolve the expected block list
        shell: bash
        run: |
          blocks="$(bash tests/helpers/resolve_driver.sh lib . claude starter | awk -F'\t' '{print $1}')"
          [ -n "$blocks" ] || { echo "the resolver produced nothing"; exit 3; }
          echo "VIBE_BLOCKS=$blocks" >> "$GITHUB_ENV"

      - name: state dir
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'vibe-real'
          New-Item -ItemType Directory -Path $state -Force | Out-Null

      - name: precheck (the baseline the judge measures vibe against)
        # BEFORE the install, deliberately, and ONCE. These images ship Git, Node and
        # gh on the Machine PATH, so vibe's SATISFIED_WIN cells find them and the
        # INSTALL_WIN cells never run - while the probe reported `shell.regpath.git 1`
        # and the judge counted that as a pass. The delta is what tells the two apart,
        # and a baseline retaken after run 1 would not be one.
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'vibe-real'
          & powershell.exe -NoProfile -File tests\real\precheck.ps1 `
            -Baseline (Join-Path $state 'precheck.tsv')

      - name: real install, TWICE (Windows PowerShell 5.1)
        env:
          LANE: ${{ matrix.os }}
        # Twice, like every other lane. Running once contradicted the record in three
        # places, and because judge.sh deliberately keeps its assertion set small ON
        # THE GROUNDS THAT THE DIFFERENTIALS COVER THE REST, the Windows oracle was far
        # weaker than the record implied: a second `winget install` erroring, a
        # duplicated `@<canonical>` import line and a second registry PATH append were
        # all undetectable.
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'vibe-real'
          $tab = [char]9
          # 'Continue', deliberately. GitHub prepends $ErrorActionPreference='stop' to
          # every step, and under 'stop' Windows PowerShell 5.1 turns a native command's
          # stderr into a TERMINATING NativeCommandError the moment `*>&1` merges it. One
          # stderr line from winget or the Node installer would kill the step with $out
          # unassigned - no transcript, no exit file, and the probe and judge never run.
          # The three-class machinery would be skipped for the only Windows lane.
          $ErrorActionPreference = 'Continue'
          foreach ($run in 1, 2) {
            # Rewritten per run, in one Set-Content, so `run` is honest: the judge
            # branches on it, and the second run's honest claim is the opposite of the
            # first's.
            @(
              "lane$tab$env:LANE"
              "adapter${tab}runner"
              "guest$tab$env:LANE"
              "axis${tab}base"
              "mode${tab}apply"
              "run$tab$run"
              "blocks$tab$env:VIBE_BLOCKS"
            ) | Set-Content -LiteralPath (Join-Path $state 'lane.tsv')

            # Every stream captured: the UI goes to Write-Host and apply.ps1 exits 0
            # even when steps warned, so the verdict has to come from the text.
            $out = & powershell.exe -NoProfile -File lib\apply.ps1 -Yes -NoLaunch claude starter *>&1
            $rc = $LASTEXITCODE
            # Out-String -Width, then .NET: `Out-File` renders through the host's
            # formatter and WRAPS at the console buffer width, so a UI line longer than
            # that loses its glyph prefix on the continuation - and the prefix is the
            # channel marker the probe globs on. UTF-8 without a BOM for the same
            # reason the probe reads it that way: 5.1's default encodings do not
            # round-trip the U+203A and U+2717 prefixes.
            $text = ($out | Out-String -Width 4096)
            $enc = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText((Join-Path $state 'transcript.log'), $text, $enc)
            [System.IO.File]::WriteAllText((Join-Path $state "run$run.transcript"), $text, $enc)
            $out | ForEach-Object { Write-Host $_ }
            Set-Content -LiteralPath (Join-Path $state 'exit') -Value $rc

            & powershell.exe -NoProfile -File tests\real\probe.ps1 `
              -StateDir $state -Manifest (Join-Path $state "run$run.manifest")
          }
          # The JUDGE decides, and it asserts transcript.exit is 0. Exiting non-zero
          # here would skip it, so a real failure would arrive with no TAP - and
          # Set-Content does not reset $LASTEXITCODE, which GitHub's appended
          # `exit $LASTEXITCODE` would otherwise propagate.
          exit 0

      - name: judge both runs, and diff them
        shell: bash
        run: |
          state="$(cygpath -u "$RUNNER_TEMP")/vibe-real"
          set +e
          worst=0
          # shellcheck source=tests/real/lib/class.sh
          . tests/real/lib/class.sh
          # shellcheck source=tests/real/lib/manifest.sh
          . tests/real/lib/manifest.sh
          for n in 1 2; do
            echo "--- run $n ---"
            # shellcheck disable=SC2086  # the block list is deliberately word-split
            bash tests/real/judge.sh "$state/run$n.manifest" $VIBE_BLOCKS | tee "$state/run$n.tap"
            worst="$(class_worse "$worst" "${PIPESTATUS[0]}")"
          done
          # Idempotence, as a differential rather than a second set of assertions -
          # the same rule every POSIX lane is held to, and the reason judge.sh can
          # keep its own assertion set small.
          if ! manifest_diff "run 1" "$state/run1.manifest" "run 2" "$state/run2.manifest" \
               manifest_state_subset; then
            worst="$(class_worse "$worst" "$CLASS_ASSERT")"
          fi
          case "$worst" in
            0) ;;
            2) echo "::warning::infrastructure, not a vibe failure (class 2)" ;;
            *) exit "$worst" ;;
          esac

      - name: log bundle
        if: failure()
        shell: bash
        run: cp -r "$(cygpath -u "$RUNNER_TEMP")/vibe-real" ./vibe-real-bundle || true
      - name: upload log bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-windows-${{ matrix.os }}
          path: vibe-real-bundle/
          retention-days: 7
