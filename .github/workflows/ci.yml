name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS runner so the suite runs against the real /bin/bash 3.2 — the
    # support contract this project targets.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run lint
      - run: mise run test-bash32
